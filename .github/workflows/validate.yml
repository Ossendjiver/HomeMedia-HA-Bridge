name: Validate Home Media Bridge
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.9.4
      - run: PYTHONPATH=. python -W ignore -m unittest discover -s tests -v
